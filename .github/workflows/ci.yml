name: CI

# Safety net: every push and PR to main builds the whole solution and runs
# all tests (Core and headless Avalonia App tests both run on Linux).
# The runner has pwsh, so the tests that run the real kit tools run too;
# the ISO test returns early because xorriso is not installed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch supersedes the running CI for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore KitBuilder.sln

      - name: Build
        run: dotnet build KitBuilder.sln -c Release --no-restore

      - name: Test
        run: dotnet test KitBuilder.sln -c Release --no-build
